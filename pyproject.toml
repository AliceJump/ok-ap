[project]
name = "ok-template"
version = "0.1.0"
description = "A ready-to-use template for building game automation tools on ok-script"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ok-script==1.0.180",
    "onnxocr-ppocrv5==0.0.14",
    "openvino==2026.0.0",
    "opencv-python==4.12.0.88",
    "json5==0.15.0",
    "imagehash==4.3.2",
    "pyautogui==0.9.54",
    "pynput==1.8.2",
    "playwright==1.57.0",
]

[dependency-groups]
dev = [
    "polib",
]

[tool.uv]
package = false