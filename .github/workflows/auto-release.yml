name: Auto Release

on:
  schedule:
    # 每日北京时间 0:00（= UTC 16:00，GitHub Actions 的 cron 使用 UTC）
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changes in deploy.txt paths since last tag
        id: check
        run: |
          set -euo pipefail

          # deploy.txt 每行一个「发版关注路径」（目录或文件），支持 CRLF，空行忽略
          mapfile -t paths < deploy.txt
          watched=()
          for line in "${paths[@]}"; do
            line=${line%$'\r'}
            [ -z "$line" ] && continue
            watched+=("$line")
          done
          echo "watched paths: ${watched[*]}"

          last_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1 || true)
          echo "last_tag=${last_tag:-<none>}"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"

          if [ "${#watched[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$last_tag" ]; then
            latest_commit=$(git log --topo-order --format=%H -- "${watched[@]}" | head -n 1 || true)
          else
            latest_commit=$(git log --topo-order --format=%H "$last_tag"..HEAD -- "${watched[@]}" | head -n 1 || true)
          fi

          if [ -z "$latest_commit" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes in watched paths; skip release"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest_commit=$latest_commit" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          last_tag="${{ steps.check.outputs.last_tag }}"
          if [ -z "$last_tag" ]; then
            next="v0.1.0"
          else
            version="${last_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            if [ "$patch" -ge 99 ]; then
              patch=0
              minor=$((minor + 1))
            else
              patch=$((patch + 1))
            fi
            next="v${major}.${minor}.${patch}"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          target="${{ steps.check.outputs.latest_commit }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" "$target" -m "$next"
          git push origin "$next"
          echo "Released $next -> $target"

      - name: Trigger Build via repository_dispatch
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"auto-release\",\"client_payload\":{\"tag\":\"$next\"}}"
          echo "Dispatched build for $next"